spring:
  application:
    name: educenter
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/educenter?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:educenter}
    password: ${DB_PASSWORD:educenter}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Ho_Chi_Minh
        jdbc.batch_size: 50
        order_inserts: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: Asia/Ho_Chi_Minh
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum!!}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  seed:
    demo: ${APP_SEED_DEMO:false}
  mail:
    from: ${MAIL_FROM:EduCenter <no-reply@educenter.vn>}
    enabled: ${MAIL_ENABLED:true}
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    session-cron: ${REMINDER_SESSION_CRON:0 0 19 * * *}
    fee-cron: ${REMINDER_FEE_CRON:0 0 8 * * *}
    fee-days-before: 3
  zalo:
    mode: ${ZALO_MODE:mock}
  pdf:
    font-path: ${PDF_FONT_PATH:}
  login-rate-limit:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
    window-seconds: 300
