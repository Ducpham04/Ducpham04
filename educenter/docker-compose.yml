# Chạy toàn bộ hệ thống: docker compose up -d --build
# Web: http://localhost:3000 · API docs: http://localhost:8080/swagger-ui.html · Mailpit: http://localhost:8025
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-educenter}
      MYSQL_USER: ${DB_USERNAME:-educenter}
      MYSQL_PASSWORD: ${DB_PASSWORD:-educenter}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-change-me}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-educenter}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-educenter}
      DB_PASSWORD: ${DB_PASSWORD:-educenter}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-min-32-bytes!!}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-EduCenter <no-reply@educenter.vn>}
      ZALO_MODE: ${ZALO_MODE:-mock}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql-data:
