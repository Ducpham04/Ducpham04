<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Phạm Văn Đức — Software Engineer · Java / Spring Boot · React">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#071233"/>
      <stop offset="1" stop-color="#0B2350"/>
    </linearGradient>

    <!-- shimmering name gradient -->
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.35" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#3B82F6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowLime" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- typing clips -->
    <clipPath id="t1"><rect x="96" y="232" height="34" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.15;0.28;0.33;1" values="0;345;345;0;0"/></rect></clipPath>
    <clipPath id="t2"><rect x="96" y="232" height="34" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.33;0.48;0.61;0.66;1" values="0;0;368;368;0;0"/></rect></clipPath>
    <clipPath id="t3"><rect x="96" y="232" height="34" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.66;0.81;0.95;1" values="0;0;356;356;0"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace; }
    .sans { font-family: 'Segoe UI','Inter',-apple-system,'Helvetica Neue','DejaVu Sans',Arial,sans-serif; }
    .fade1 { opacity: 0; animation: up .9s ease-out .1s forwards; }
    .fade2 { opacity: 0; animation: up .9s ease-out .5s forwards; }
    .fade3 { opacity: 0; animation: up .9s ease-out .9s forwards; }
    .fade4 { opacity: 0; animation: up .9s ease-out 1.3s forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .spin  { transform-origin: 975px 170px; animation: spin 24s linear infinite; }
    .spinR { transform-origin: 975px 170px; animation: spin 16s linear infinite reverse; }
    .spinF { transform-origin: 975px 170px; animation: spin 9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cr24 { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite reverse; }
    .cr16 { transform-box: fill-box; transform-origin: center; animation: spin 16s linear infinite; }
    .pulse { transform-origin: 975px 170px; animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dot { animation: dot 1.6s ease-in-out infinite; }
    @keyframes dot { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <!-- background -->
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <g>
    <rect x="-40" y="-40" width="1280" height="420" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 40" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- drifting glows -->
  <circle cx="220" cy="80" r="260" fill="url(#glowLime)">
    <animate attributeName="cx" values="220;320;220" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;130;80" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="260" r="300" fill="url(#glowTeal)">
    <animate attributeName="cx" values="1000;900;1000" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- scanline -->
  <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
    <animate attributeName="y" values="-80;340" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- rising particles -->
  <g fill="#38BDF8">
    <circle cx="80"  cy="340" r="1.6"><animate attributeName="cy" values="340;-10" dur="9s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="340" r="1.2"><animate attributeName="cy" values="340;-10" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="340" r="2"><animate attributeName="cy" values="340;-10" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="340" r="1.4"><animate attributeName="cy" values="340;-10" dur="8s"  begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="340" r="1.8"><animate attributeName="cy" values="340;-10" dur="11s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="11s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="340" r="1.3" fill="#6366F1"><animate attributeName="cy" values="340;-10" dur="10s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="340" r="1.1" fill="#6366F1"><animate attributeName="cy" values="340;-10" dur="13s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="13s" begin="6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- left: identity -->
  <g class="fade1">
    <rect x="72" y="52" width="208" height="28" rx="14" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.45"/>
    <circle cx="90" cy="66" r="4.5" fill="#38BDF8" class="dot"/>
    <text x="104" y="71" class="mono" font-size="13" fill="#38BDF8" letter-spacing="0.5">OPEN TO WORK · HCMC</text>
  </g>

  <g class="fade2">
    <text x="70" y="150" class="sans" font-size="66" font-weight="800" fill="url(#name)" filter="url(#neon)" letter-spacing="-1">Phạm Văn Đức</text>
  </g>

  <g class="fade3">
    <text x="72" y="196" class="sans" font-size="23" font-weight="500" fill="#E2E8F0">Software Engineer
      <tspan fill="#38BDF8"> · </tspan>Java / Spring Boot<tspan fill="#38BDF8"> · </tspan>React</text>
  </g>

  <!-- terminal typing line -->
  <g class="fade4">
    <text x="72" y="256" class="mono" font-size="19" fill="#38BDF8">❯</text>
    <g clip-path="url(#t1)"><text x="98" y="256" class="mono" font-size="19" fill="#CBD5E1">Web &amp; Full-stack Developer</text></g>
    <g clip-path="url(#t2)"><text x="98" y="256" class="mono" font-size="19" fill="#CBD5E1">Final-year @ FPT University HCMC</text></g>
    <g clip-path="url(#t3)"><text x="98" y="256" class="mono" font-size="19" fill="#CBD5E1">Instructor @ MindX · Freelancer</text></g>
    <rect y="240" width="10" height="21" fill="#38BDF8" class="blink">
      <animate attributeName="x" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.15;0.28;0.33;0.48;0.61;0.66;0.81;0.95;1"
        values="100;446;446;100;469;469;100;457;457;100"/>
    </rect>
    <text x="72" y="300" class="mono" font-size="13" fill="#64748B">// clean code · scalable APIs · shipped with Docker</text>
  </g>

  <!-- right: orbit emblem -->
  <g class="pulse">
    <circle cx="975" cy="170" r="54" fill="#071233" stroke="#38BDF8" stroke-width="1.5" filter="url(#soft)"/>
    <text x="975" y="182" text-anchor="middle" class="mono" font-size="32" font-weight="700" fill="#38BDF8">&lt;/&gt;</text>
  </g>

  <g class="spinF">
    <circle cx="975" cy="170" r="82" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 10"/>
    <circle cx="1057" cy="170" r="5" fill="#38BDF8" filter="url(#soft)"/>
  </g>
  <g class="spinR">
    <circle cx="975" cy="170" r="112" fill="none" stroke="#6366F1" stroke-opacity="0.28" stroke-width="1"/>
    <g transform="translate(975 58)"><g class="cr16">
      <rect x="-27" y="-13" width="54" height="26" rx="13" fill="#0A1636" stroke="#6DB33F"/>
      <text y="5" text-anchor="middle" class="mono" font-size="12" fill="#6DB33F">Spring</text>
    </g></g>
    <g transform="translate(975 282)"><g class="cr16">
      <rect x="-25" y="-13" width="50" height="26" rx="13" fill="#0A1636" stroke="#61DAFB"/>
      <text y="5" text-anchor="middle" class="mono" font-size="12" fill="#61DAFB">React</text>
    </g></g>
  </g>
  <g class="spin">
    <circle cx="975" cy="170" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="1 7"/>
    <g transform="translate(835 170)"><g class="cr24">
      <rect x="-22" y="-13" width="44" height="26" rx="13" fill="#0A1636" stroke="#ED8B00"/>
      <text y="5" text-anchor="middle" class="mono" font-size="12" fill="#ED8B00">Java</text>
    </g></g>
    <g transform="translate(1115 170)"><g class="cr24">
      <rect x="-30" y="-13" width="60" height="26" rx="13" fill="#0A1636" stroke="#2496ED"/>
      <text y="5" text-anchor="middle" class="mono" font-size="12" fill="#2496ED">Docker</text>
    </g></g>
  </g>

  <!-- border glow -->
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#38BDF8" stroke-opacity="0.18">
    <animate attributeName="stroke-opacity" values="0.1;0.35;0.1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
