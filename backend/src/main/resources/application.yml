spring:
  application:
    name: zma-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zma?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:zma}
    password: ${DB_PASSWORD:zma_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Ho_Chi_Minh
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  jwt:
    # BẮT BUỘC đổi ở production: chuỗi ngẫu nhiên >= 32 ký tự (openssl rand -base64 48)
    secret: ${APP_JWT_SECRET:change-me-this-is-a-dev-only-secret-at-least-32-bytes!!}
    access-ttl: ${APP_JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${APP_JWT_REFRESH_TTL:P30D}
    issuer: zma-starter
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174,https://h5.zdn.vn,zbrowser://h5.zdn.vn}
  zalo:
    # true = không gọi Zalo thật, chấp nhận token "mock-<zaloId>" (CHỈ dùng cho demo/dev)
    mock: ${ZALO_MOCK:true}
    app-id: ${ZALO_APP_ID:}
    app-secret: ${ZALO_APP_SECRET:}
    graph-base-url: ${ZALO_GRAPH_BASE_URL:https://graph.zalo.me}
    timeout: PT10S
  notification:
    provider: ${NOTIFICATION_PROVIDER:mock}   # mock | zns
    zns-base-url: ${ZNS_BASE_URL:https://business.openapi.zalo.me}
    oa-access-token: ${ZALO_OA_ACCESS_TOKEN:}
    feedback-template-id: ${ZNS_FEEDBACK_TEMPLATE_ID:}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}   # mock | zalo
    checkout-private-key: ${ZALO_CHECKOUT_PRIVATE_KEY:dev-checkout-private-key}
    method: ${ZALO_CHECKOUT_METHOD:}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    public-path: /uploads
  seed:
    demo-data: ${SEED_DEMO_DATA:true}
