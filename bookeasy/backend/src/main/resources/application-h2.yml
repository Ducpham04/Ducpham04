# Chạy nhanh không cần MySQL: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  datasource:
    url: jdbc:h2:mem:bookeasy;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
app:
  seed:
    demo: ${APP_SEED_DEMO:true}
  mail:
    enabled: ${MAIL_ENABLED:false}
