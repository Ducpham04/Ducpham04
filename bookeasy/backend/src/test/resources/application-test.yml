spring:
  datasource:
    url: jdbc:h2:mem:bookeasy-test-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  mail:
    host: localhost
    port: 1
app:
  seed:
    demo: false
  rate-limit-enabled: false
  mail:
    enabled: false
  scheduler:
    initial-delay-ms: 3600000
    delay-ms: 3600000
  upload-dir: target/test-uploads
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
