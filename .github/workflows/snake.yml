name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2563EB&color_dots=#EBEDF0,#BFDBFE,#93C5FD,#3B82F6,#1D4ED8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0F1D44,#1E3A8A,#1D4ED8,#3B82F6,#7DD3FC

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
