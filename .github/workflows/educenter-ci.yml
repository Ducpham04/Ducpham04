name: EduCenter CI

on:
  push:
    paths: ["educenter/**", ".github/workflows/educenter-ci.yml"]
  pull_request:
    paths: ["educenter/**", ".github/workflows/educenter-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: educenter/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, unit + integration tests (Testcontainers MySQL)
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: educenter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: educenter/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: educenter
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Playwright
        working-directory: educenter/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:3000 npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose logs backend | tail -200
